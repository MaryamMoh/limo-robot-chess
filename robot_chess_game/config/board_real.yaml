# Chessboard taped on the laboratory floor for the real LIMO PRO.
# Measure the board centre and orientation in the map built with gmapping
# (e.g. with RViz "Publish Point") and enter them below.
#
# The real pieces are thinner (e.g. bottles / cans, 10 cm diameter), which
# allows 0.6 m squares; BoardGeometry.validate() rejects layouts where the
# robot could not turn between two pieces.
board:
  square_size: 0.6            # 8 x 0.6 = 4.8 m board
  origin_x: 0.0               # board centre in the map frame  <-- measure
  origin_y: 0.0               #                                <-- measure
  yaw: 0.0                    # board +x (a->h) direction in the map frame
  piece_radius: 0.05
  graveyard_offset: 3.4
  graveyard_spacing: 0.3
  graveyard_slots: 15
  graveyard_approach: 0.35
  ring_margin: 0.4
  robot_length: 0.32
  robot_width: 0.22

home:
  white: {x: 0.0, y: -3.4, yaw: 1.5708}
  black: {x: 0.0, y: 3.4, yaw: -1.5708}
