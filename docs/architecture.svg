<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{stroke:#333;stroke-width:1.4}
      .brain{fill:#e8f1ff}
      .robot{fill:#eaf7ea}
      .world{fill:#fff4e0}
      .other{fill:#f3e8ff}
      .line{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .t{font-weight:bold}
      .s{font-size:11px;fill:#555}
    </style>
  </defs>
  <rect width="960" height="520" fill="#fafafa"/>

  <text x="30" y="34" class="t" font-size="15">My robot (this repository)</text>
  <rect x="20" y="44" width="600" height="456" rx="12" fill="none" stroke="#7a7" stroke-dasharray="6 4"/>

  <rect class="box brain" x="200" y="62" width="250" height="84" rx="8"/>
  <text x="325" y="84" text-anchor="middle" class="t">chess_player</text>
  <text x="325" y="102" text-anchor="middle" class="s">game state + legal moves (python-chess)</text>
  <text x="325" y="117" text-anchor="middle" class="s">engine: alpha-beta / Stockfish</text>
  <text x="325" y="132" text-anchor="middle" class="s">move inference from the board</text>

  <rect class="box robot" x="50" y="200" width="220" height="70" rx="8"/>
  <text x="160" y="222" text-anchor="middle" class="t">board_vision</text>
  <text x="160" y="240" text-anchor="middle" class="s">project squares into the image</text>
  <text x="160" y="255" text-anchor="middle" class="s">empty / white / black per square</text>
  <path class="line" d="M260 148 L190 198"/>
  <text x="170" y="175" class="s">observe_board</text>

  <rect class="box robot" x="370" y="200" width="220" height="70" rx="8"/>
  <text x="480" y="222" text-anchor="middle" class="t">arm_executor</text>
  <text x="480" y="240" text-anchor="middle" class="s">tasks → top-down tool paths</text>
  <text x="480" y="255" text-anchor="middle" class="s">IK (myCobot 280), gripper, stations</text>
  <path class="line" d="M390 148 L460 198"/>
  <text x="440" y="175" class="s">execute_move</text>

  <rect class="box robot" x="50" y="320" width="220" height="50" rx="8"/>
  <text x="160" y="342" text-anchor="middle" class="t">wrist camera</text>
  <text x="160" y="358" text-anchor="middle" class="s">Gazebo camera / USB camera</text>
  <path class="line" d="M160 318 V272"/>

  <rect class="box robot" x="370" y="320" width="220" height="50" rx="8"/>
  <text x="480" y="342" text-anchor="middle" class="t">arm + gripper controllers</text>
  <text x="480" y="358" text-anchor="middle" class="s">ros_control (sim) / mycobot_driver (real)</text>
  <path class="line" d="M480 272 V318"/>

  <rect class="box world" x="140" y="420" width="360" height="60" rx="8"/>
  <text x="320" y="444" text-anchor="middle" class="t">the chessboard</text>
  <text x="320" y="462" text-anchor="middle" class="s">the only thing both robots share</text>
  <path class="line" d="M160 418 V372"/>
  <path class="line" d="M480 372 V418"/>

  <rect class="box other" x="680" y="200" width="240" height="90" rx="8"/>
  <text x="800" y="224" text-anchor="middle" class="t">opponent robot</text>
  <text x="800" y="242" text-anchor="middle" class="s">lab: another team's arm + code</text>
  <text x="800" y="257" text-anchor="middle" class="s">sim: opponent_simulator.py</text>
  <text x="800" y="272" text-anchor="middle" class="s">(watches the board, moves pieces)</text>
  <path class="line" d="M800 292 C800 430 620 450 502 450"/>
  <path class="line" d="M502 440 C640 430 760 380 780 294"/>
</svg>
