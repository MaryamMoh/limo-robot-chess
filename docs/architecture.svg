<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.4;rx:8}
      .game{fill:#e8f1ff}
      .robot{fill:#eaf7ea}
      .sim{fill:#fff4e0}
      .line{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .t{font-weight:bold}
      .s{font-size:11px;fill:#555}
    </style>
  </defs>
  <rect width="980" height="560" fill="#fafafa"/>

  <!-- players -->
  <rect class="box game" x="30" y="30" width="170" height="54"/>
  <text x="115" y="53" text-anchor="middle" class="t">player_console white</text>
  <text x="115" y="71" text-anchor="middle" class="s">human player 1</text>
  <rect class="box game" x="780" y="30" width="170" height="54"/>
  <text x="865" y="53" text-anchor="middle" class="t">player_console black</text>
  <text x="865" y="71" text-anchor="middle" class="s">human player 2</text>

  <!-- referee -->
  <rect class="box game" x="360" y="24" width="260" height="70"/>
  <text x="490" y="48" text-anchor="middle" class="t">chess_referee</text>
  <text x="490" y="66" text-anchor="middle" class="s">python-chess rules, turn order</text>
  <text x="490" y="82" text-anchor="middle" class="s">move_planner: move → piece tasks</text>
  <path class="line" d="M200 57 H358"/>
  <path class="line" d="M780 57 H622"/>
  <text x="280" y="50" text-anchor="middle" class="s">/chess/submit_move</text>
  <text x="700" y="50" text-anchor="middle" class="s">/chess/submit_move</text>

  <rect class="box game" x="390" y="128" width="200" height="44"/>
  <text x="490" y="148" text-anchor="middle" class="t">board_visualizer</text>
  <text x="490" y="164" text-anchor="middle" class="s">/chess/state → RViz markers</text>
  <path class="line" d="M490 94 V126"/>

  <!-- robot white -->
  <rect x="20" y="200" width="440" height="330" rx="12" fill="none" stroke="#7a7" stroke-dasharray="6 4"/>
  <text x="34" y="222" class="t" fill="#373">/white  (same stack in /black)</text>
  <path class="line" d="M420 94 L240 238"/>
  <text x="300" y="150" class="s">execute_move (action)</text>

  <rect class="box robot" x="140" y="240" width="200" height="60"/>
  <text x="240" y="262" text-anchor="middle" class="t">piece_mover</text>
  <text x="240" y="279" text-anchor="middle" class="s">approach → align → verify</text>
  <text x="240" y="294" text-anchor="middle" class="s">→ pick → transport → place</text>

  <rect class="box robot" x="40" y="330" width="130" height="44"/>
  <text x="105" y="350" text-anchor="middle" class="t">piece_vision</text>
  <text x="105" y="366" text-anchor="middle" class="s">OpenCV colour bands</text>
  <path class="line" d="M190 300 L130 328"/>
  <text x="120" y="318" class="s">verify_piece</text>

  <rect class="box robot" x="200" y="330" width="120" height="44"/>
  <text x="260" y="350" text-anchor="middle" class="t">move_base</text>
  <text x="260" y="366" text-anchor="middle" class="s">Dijkstra + DWA</text>
  <path class="line" d="M250 300 V328"/>

  <rect class="box robot" x="340" y="330" width="100" height="44"/>
  <text x="390" y="350" text-anchor="middle" class="t">amcl</text>
  <text x="390" y="366" text-anchor="middle" class="s">map → odom</text>

  <rect class="box robot" x="200" y="400" width="120" height="44"/>
  <text x="260" y="420" text-anchor="middle" class="t">ekf</text>
  <text x="260" y="436" text-anchor="middle" class="s">odom → base</text>
  <path class="line" d="M260 398 V376"/>

  <rect class="box robot" x="40" y="400" width="140" height="44"/>
  <text x="110" y="420" text-anchor="middle" class="t">noisy_odometry</text>
  <text x="110" y="436" text-anchor="middle" class="s">odometry motion model</text>
  <path class="line" d="M180 422 H198"/>

  <rect class="box sim" x="40" y="468" width="400" height="48"/>
  <text x="240" y="488" text-anchor="middle" class="t">LIMO PRO (Gazebo or real)</text>
  <text x="240" y="505" text-anchor="middle" class="s">LiDAR /scan · camera · IMU · wheel odometry · /cmd_vel</text>
  <path class="line" d="M110 466 V446"/>
  <path class="line" d="M300 466 L300 446"/>
  <path class="line" d="M390 466 V376"/>
  <path class="line" d="M105 466 C20 440 20 400 60 376"/>

  <!-- carrier / gazebo -->
  <rect class="box sim" x="540" y="240" width="220" height="60"/>
  <text x="650" y="262" text-anchor="middle" class="t">chess_carrier</text>
  <text x="650" y="279" text-anchor="middle" class="s">sim: spawn + carry pieces in Gazebo</text>
  <text x="650" y="294" text-anchor="middle" class="s">real: assistant loads / unloads</text>
  <path class="line" d="M340 270 H538"/>
  <text x="440" y="263" text-anchor="middle" class="s">attach / release / replace</text>

  <rect class="box sim" x="540" y="330" width="220" height="44"/>
  <text x="650" y="350" text-anchor="middle" class="t">map_server</text>
  <text x="650" y="366" text-anchor="middle" class="s">known arena / lab map (/map)</text>
  <path class="line" d="M540 352 H442"/>

  <rect class="box sim" x="540" y="400" width="220" height="60"/>
  <text x="650" y="422" text-anchor="middle" class="t">Gazebo chess arena</text>
  <text x="650" y="439" text-anchor="middle" class="s">generated world + matching map</text>
  <text x="650" y="454" text-anchor="middle" class="s">5.6 m board, graveyards, landmarks</text>
</svg>
