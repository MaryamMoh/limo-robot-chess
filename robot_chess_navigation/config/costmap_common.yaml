# Shared by the global and the local costmap.
# LIMO footprint (four wheel differential mode): 0.32 m x 0.22 m.
footprint: [[-0.16, -0.11], [-0.16, 0.11], [0.16, 0.11], [0.16, -0.11]]
footprint_padding: 0.01
transform_tolerance: 0.5
resolution: 0.05

obstacle_layer:
  enabled: true
  track_unknown_space: false
  combination_method: 1
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 4.0
    raytrace_range: 6.0

# The gaps between pieces are 0.52 m wide (0.7 m squares) - keep the
# inflation narrow and steep so the robot can drive along the square edges.
inflation_layer:
  enabled: true
  inflation_radius: 0.30
  cost_scaling_factor: 8.0

static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: false
