# AMCL: particle filter localisation on the known arena map.
# The initial pose is known (robot home pose) and set in the launch file.
use_map_topic: true
global_frame_id: map
tf_broadcast: true
transform_tolerance: 0.5

min_particles: 300
max_particles: 2000
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.05
update_min_a: 0.1
resample_interval: 1
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
gui_publish_rate: 5.0
save_pose_rate: 0.5

initial_cov_xx: 0.01
initial_cov_yy: 0.01
initial_cov_aa: 0.01

# Motion model - matches the noise injected by noisy_odometry.py.
odom_model_type: diff-corrected
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.05
odom_alpha4: 0.05

# Sensor model - pieces on the board are not in the map, so a sizeable
# share of the beams is explained by "unexpected obstacles" (z_rand).
laser_model_type: likelihood_field
laser_min_range: 0.12
laser_max_range: 12.0
laser_max_beams: 90
laser_z_hit: 0.8
laser_z_rand: 0.2
laser_sigma_hit: 0.05
laser_likelihood_max_dist: 2.0
