# ros_control controllers of the simulated arm (gazebo_ros_control).
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint2_to_joint1
    - joint3_to_joint2
    - joint4_to_joint3
    - joint5_to_joint4
    - joint6_to_joint5
    - joint6output_to_joint6
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.5
  state_publish_rate: 25

gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - finger_left_joint
    - finger_right_joint
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.5
  state_publish_rate: 25
